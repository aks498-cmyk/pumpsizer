[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpsizer"
version = "0.2.0"
description = "Water-supply pump sizing, operating-point analysis and EPANET-compatible curve generation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ashok" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
excel = ["openpyxl>=3.1"]
epanet = ["epyt>=1.2"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "openpyxl>=3.1", "epyt>=1.2"]

[project.scripts]
pumpsizer = "pumpsizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pumpsizer = ["data/*.yaml", "data/catalog/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W pycodestyle+pyflakes, I import order, UP pyupgrade, B bugbear.
# E501 (line length) is left to the editor / a formatter; E702 (semicolons)
# is used deliberately in tight array-init and plotting blocks; B905
# (zip strict=) is 3.10+ only and noisy here.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E702", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["pumpsizer"]
