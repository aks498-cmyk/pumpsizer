[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpsizer"
version = "0.1.0"
description = "Water-supply pump sizing, operating-point analysis and EPANET-compatible curve generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ashok" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "openpyxl>=3.1"]

[project.scripts]
pumpsizer = "pumpsizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pumpsizer = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
