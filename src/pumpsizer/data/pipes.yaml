  hdpe:
    label: HDPE
    standard: "PE100, ISO 4427;  ID = OD * (1 - 2/SDR)"
    roughness_mm_new: 0.007
    roughness_mm_used: 0.05
    hazen_williams_c: 150
    youngs_modulus_gpa: 1.1
    outer_diameters_mm: [90, 110, 125, 140, 160, 180, 200, 225, 250, 280, 315,
                         355, 400, 450, 500, 560, 630, 710, 800, 900, 1000, 1200]
    series:            # SDR -> nominal pressure class (PE100, MRS 10)
      SDR26: 26        # PN 6.3
      SDR21: 21        # PN 8
      SDR17: 17        # PN 10
      SDR13.6: 13.6    # PN 12.5
      SDR11: 11        # PN 16
    default_series: SDR17

  upvc:
    label: uPVC
    standard: "ISO 1452;  ID = OD * (1 - 2/SDR)"
    roughness_mm_new: 0.007
