# Pipe internal-diameter database.
#
# Two ways to describe a material:
#   sizes:            {DN: internal_diameter_mm}            -> one bore per DN
#   outer_diameters_mm + series: {name: SDR}               -> ID = OD * (1 - 2/SDR)
#
# `roughness_mm_new` / `roughness_mm_used` feed the Darcy-Weisbach method;
# `hazen_williams_c` feeds the H-W method.  Replace / extend these tables with
# the exact figures from your project's approved pipe schedule when available.
# The ductile-iron DN400 (402.8 mm) and DN700 (704.4 mm) bores match the
# Material sheet of the source workbook.

# Elastic data for wave-celerity (water-hammer) calculations:
#   youngs_modulus_gpa      - pipe wall Young's modulus E
#   wall_ratio_e_over_d     - representative wall thickness / internal diameter,
#                            used only when an explicit wall thickness is not
#                            given.  For HDPE/uPVC the true value is 1/SDR and
#                            is used automatically.
water_bulk_modulus_gpa: 2.19        # K for water at ~20 degC

materials:

  ductile_iron:
    label: Ductile Iron
    standard: "EN 545 / ISO 2531, cement-mortar lined (representative bore)"
    roughness_mm_new: 0.06
    roughness_mm_used: 0.30
    hazen_williams_c: 140
    youngs_modulus_gpa: 170
    wall_ratio_e_over_d: 0.042
    sizes:
      80: 78.0
      100: 102.6
      150: 154.6
      200: 204.6
      250: 257.4
      300: 308.4
      350: 359.6
      400: 402.8
      450: 455.4
      500: 507.6
      600: 610.4
      700: 704.4
      800: 806.0
      900: 907.4
      1000: 1008.6
      1100: 1110.0
      1200: 1211.4

