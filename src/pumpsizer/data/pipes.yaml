    label: GRP
    standard: "ISO 10639 / AWWA C950 (representative bore, PN10)"
    roughness_mm_new: 0.029
    roughness_mm_used: 0.10
    hazen_williams_c: 150
    youngs_modulus_gpa: 20
    wall_ratio_e_over_d: 0.030
    sizes:
      100: 103.0
      150: 154.0
      200: 205.0
